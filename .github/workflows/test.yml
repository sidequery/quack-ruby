name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        ruby: ['3.2', '3.3', '3.4']
    runs-on: ${{ matrix.os }}
    env:
      CARGO: ${{ github.workspace }}/script/cached-cargo
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: jdx/mr-boxington-action@v1
        with:
          working-directory: ext/quack
          cache-key-suffix: ruby-${{ matrix.ruby }}
      - uses: astral-sh/setup-uv@v10.3.2
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake compile
      - run: script/test
      - run: cargo fmt --manifest-path ext/quack/Cargo.toml --check
      - run: cargo fmt --manifest-path ext/quack/vendor/quack_protocol/Cargo.toml --check
      - run: env -u CARGO mbx clippy --manifest-path ext/quack/Cargo.toml -- -D warnings
      - run: bundle exec rake package
