name: Release
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        default: patch
        options: [patch, minor, major]
      release_tag:
        description: Existing version tag to publish without a bump
        type: string
        required: false
concurrency:
  group: release
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  version:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.version.outputs.sha }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - id: version
        env:
          BUMP: ${{ inputs.bump }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: ruby script/prepare-release
  packages:
    needs: version
    uses: ./.github/workflows/native-gems.yml
    with:
      ref: ${{ needs.version.outputs.sha }}
  publish:
    needs: [version, packages]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - uses: actions/download-artifact@v7
        with:
          pattern: gem-*
          merge-multiple: true
          path: pkg
      - run: ruby script/verify-packages
      - uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
      - name: Publish tested native gems, then source fallback
        run: |
          for package in pkg/*-darwin.gem pkg/*-linux-gnu.gem; do
            gem push "$package"
          done
          gem push "$(ruby -e 'print "pkg/quack-ruby-#{Gem::Specification.load("quack-ruby.gemspec").version}.gem"')"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: gh release create "$RELEASE_TAG" pkg/*.gem --verify-tag --generate-notes
